<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gestión de Prácticas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <h2>Sistema de Prácticas Preprofesionales</h2>
        <form id="form-login">
            <div class="form-group">
                <label for="cedula">Usuario (Cédula):</label>
                <input type="text" id="login-cedula" name="cedula" required placeholder="Ingrese su cédula">
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="login-password" name="password" required placeholder="Ingrese su contraseña">
            </div>

            <div class="form-group">
                <label for="rol">Ingresar como:</label>
                <select id="login-rol" name="rol" required>
                    <option value="estudiante">Estudiante</option>
                    <option value="tutor">Tutor de Empresa</option>
                    <option value="admin">Administrador</option>
                </select>
            </div>

            <button type="submit">Iniciar Sesión</button>
        </form>
        <p id="mensaje-error" class="error-msg"></p>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
